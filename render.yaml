services:
  - type: web
    name: keleifei
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: keleifei-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
  - type: pserv
    name: keleifei-db
    plan: free
    region: oregon
    databaseName: keleifei
    ipAllowList: []