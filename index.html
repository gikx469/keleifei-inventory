<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#4A90E2">
<title>可乐菲出入库明细</title>
<style>
:root {
  /* 主色：冰蓝（薛之谦演唱会灯海色） */
  --primary: #7EC8E3;
  --primary-dark: #4FA8C9;
  --primary-light: #E0F4FB;
  /* 辅助色（浅色可爱系） */
  --mint: #B8E6D9;
  --mint-dark: #6EC6AE;
  --pink: #FFD6E0;
  --pink-dark: #F2A5BC;
  --lavender: #DCD3F0;
  --lavender-dark: #A88FD8;
  --cream: #FFF3D6;
  --cream-dark: #F5C86B;
  --peach: #FFE0CC;
  --peach-dark: #F0A877;

  --success: #6EC6AE;
  --warning: #F5C86B;
  --danger: #F2A5BC;
  --bg: #FAFCFE;
  --card: #FFFFFF;
  --text: #4A5568;
  --text-light: #8FA3B8;
  --border: #E5EEF5;
  --radius: 16px;
  --shadow: 0 2px 12px rgba(126, 200, 227, 0.08);
  --shadow-lg: 0 8px 24px rgba(126, 200, 227, 0.18);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; }
button { font-family: inherit; cursor: pointer; border: none; background: none; font-size: inherit; }
input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
.app { max-width: 1100px; margin: 0 auto; padding: 12px; min-height: 100vh; }

/* ---------- 顶部 ---------- */
.header { background: linear-gradient(135deg, #A8DCF0 0%, #7EC8E3 50%, #B8E6D9 100%);
  color: #fff; padding: 18px 20px; border-radius: 20px;
  box-shadow: var(--shadow-lg); margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  position: relative; overflow: hidden; }
.header::before { content: '☁️'; position: absolute; right: -10px; top: -15px; font-size: 80px; opacity: 0.2; }
.header::after { content: '✨'; position: absolute; right: 60px; bottom: 5px; font-size: 24px; opacity: 0.4; }
.header h1 { font-size: 19px; font-weight: 700; letter-spacing: 0.5px; text-shadow: 0 1px 3px rgba(79,168,201,0.2); }
.header .me { font-size: 13px; opacity: 0.95; }
.header .me b { font-weight: 600; }
.header button.logout { background: rgba(255,255,255,0.3); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; backdrop-filter: blur(4px); }
.header button.logout:hover { background: rgba(255,255,255,0.45); }

/* ---------- 返回工作台按钮 ---------- */
.back-home { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px;
  background: var(--card); color: var(--primary-dark); border-radius: 20px; font-size: 13px;
  font-weight: 500; box-shadow: var(--shadow); margin-bottom: 12px; border: 1px solid var(--border); }
.back-home:hover { background: var(--primary-light); }

/* ---------- 工作台（首页宫格） ---------- */
.workbench { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
@media (min-width: 600px) { .workbench { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 900px) { .workbench { grid-template-columns: repeat(4, 1fr); } }
.wb-card { background: var(--card); border-radius: 20px; padding: 18px 14px;
  box-shadow: var(--shadow); cursor: pointer; transition: 0.25s;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  border: 2px solid transparent; position: relative; overflow: hidden; }
.wb-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.wb-card:active { transform: translateY(-1px); }
.wb-card .icon { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
  font-size: 26px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.wb-card .name { font-size: 14px; font-weight: 600; color: var(--text); }
.wb-card .desc { font-size: 11px; color: var(--text-light); text-align: center; }
.wb-card .badge-dot { position: absolute; top: 10px; right: 10px; background: var(--danger); color: #fff;
  font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: 600; box-shadow: 0 2px 6px rgba(242,165,188,0.4); }
/* 卡片配色变体 */
.wb-card.c-blue .icon { background: linear-gradient(135deg, #E0F4FB, #B8E0F0); color: #4FA8C9; }
.wb-card.c-mint .icon { background: linear-gradient(135deg, #E0F5EE, #B8E6D9); color: #6EC6AE; }
.wb-card.c-pink .icon { background: linear-gradient(135deg, #FFE9EF, #FFD6E0); color: #F2A5BC; }
.wb-card.c-lavender .icon { background: linear-gradient(135deg, #EFEAF8, #DCD3F0); color: #A88FD8; }
.wb-card.c-cream .icon { background: linear-gradient(135deg, #FFF8E5, #FFF3D6); color: #F5C86B; }
.wb-card.c-peach .icon { background: linear-gradient(135deg, #FFF0E5, #FFE0CC); color: #F0A877; }
.wb-card:hover.c-blue { border-color: #B8E0F0; }
.wb-card:hover.c-mint { border-color: #B8E6D9; }
.wb-card:hover.c-pink { border-color: #FFD6E0; }
.wb-card:hover.c-lavender { border-color: #DCD3F0; }
.wb-card:hover.c-cream { border-color: #FFF3D6; }
.wb-card:hover.c-peach { border-color: #FFE0CC; }

/* 工作台统计条 */
.wb-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.wb-stat { background: var(--card); padding: 14px 10px; border-radius: 16px; text-align: center;
  box-shadow: var(--shadow); border-top: 3px solid var(--primary); }
.wb-stat.s-mint { border-top-color: var(--mint-dark); }
.wb-stat.s-pink { border-top-color: var(--pink-dark); }
.wb-stat .num { font-size: 22px; font-weight: 700; color: var(--primary-dark); }
.wb-stat.s-mint .num { color: var(--mint-dark); }
.wb-stat.s-pink .num { color: var(--pink-dark); }
.wb-stat .lbl { font-size: 12px; color: var(--text-light); margin-top: 2px; }

/* 工作台欢迎条 */
.wb-hello { background: linear-gradient(135deg, #FFF0E5, #FFE9EF); border-radius: 18px;
  padding: 14px 18px; margin-bottom: 14px; box-shadow: var(--shadow);
  color: #6B4E5C; font-size: 14px; display: flex; align-items: center; gap: 10px; }
.wb-hello .wave { font-size: 22px; }

/* ---------- 标签栏（隐藏，改成工作台导航） ---------- */
.tabs { display: none; }

/* ---------- 卡片 ---------- */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
.card h2 { font-size: 16px; margin-bottom: 12px; color: var(--primary-dark); display: flex; align-items: center; gap: 6px; }
.card h3 { font-size: 14px; margin: 12px 0 8px; color: var(--text); font-weight: 600; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.row label { font-size: 13px; color: var(--text-light); min-width: 60px; }
.row input, .row select, .row textarea { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--border);
  border-radius: 6px; background: #fff; transition: 0.2s; }
.row input:focus, .row select:focus, .row textarea:focus { outline: none; border-color: var(--primary); }
.btn { padding: 9px 16px; border-radius: 6px; background: var(--primary); color: #fff; font-weight: 500; transition: 0.2s; }
.btn:hover { background: var(--primary-dark); }
.btn:disabled { background: var(--border); color: var(--text-light); cursor: not-allowed; }
.btn.secondary { background: var(--primary-light); color: var(--primary-dark); }
.btn.danger { background: var(--danger); }
.btn.warning { background: var(--warning); }
.btn.success { background: var(--success); }
.btn.ghost { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
.btn.small { padding: 5px 10px; font-size: 12px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

/* ---------- 表格 ---------- */
.table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: var(--primary-light); color: var(--primary-dark); padding: 9px 8px; text-align: left; font-weight: 600; white-space: nowrap; }
td { padding: 8px; border-top: 1px solid var(--border); }
tr:hover td { background: #FAFBFC; }

/* ---------- 列表卡片 ---------- */
.list { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.item-card { background: var(--card); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); border-left: 4px solid var(--primary); }
.item-card .name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
.item-card .meta { color: var(--text-light); font-size: 12px; margin-bottom: 8px; }
.item-card .qty { font-size: 22px; font-weight: 700; color: var(--primary); }
.item-card .qty small { font-size: 13px; color: var(--text-light); font-weight: 400; margin-left: 4px; }
.item-card.warn { border-left-color: var(--warning); }
.item-card.warn .qty { color: var(--warning); }
.item-card.out { border-left-color: var(--danger); }
.item-card.out .qty { color: var(--danger); }

/* ---------- Toast ---------- */
.toast-wrap { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; pointer-events: none; }
.toast { background: rgba(0,0,0,0.85); color: #fff; padding: 10px 18px; border-radius: 22px; margin-bottom: 8px;
  font-size: 14px; box-shadow: var(--shadow-lg); animation: toastIn 0.3s; max-width: 90vw; }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.warning { background: var(--warning); }
@keyframes toastIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ---------- 模态框 ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100;
  display: flex; align-items: center; justify-content: center; padding: 16px; animation: fadeIn 0.2s; }
.modal { background: var(--card); border-radius: var(--radius); padding: 20px; width: 100%; max-width: 480px;
  max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); animation: modalIn 0.3s; }
.modal h3 { margin-bottom: 14px; color: var(--primary-dark); }
.modal .row { margin-bottom: 10px; }
.modal .btn-row { justify-content: flex-end; margin-top: 16px; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ---------- 登录/注册/初始化页 ---------- */
.auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark)); }
.auth-card { background: #fff; border-radius: var(--radius); padding: 32px 28px; width: 100%; max-width: 380px; box-shadow: var(--shadow-lg); }
.auth-card h1 { font-size: 22px; text-align: center; margin-bottom: 6px; color: var(--primary-dark); }
.auth-card .sub { text-align: center; color: var(--text-light); font-size: 13px; margin-bottom: 24px; }
.auth-card .field { margin-bottom: 14px; }
.auth-card .field label { display: block; font-size: 13px; color: var(--text-light); margin-bottom: 4px; }
.auth-card .field input { width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; }
.auth-card .field input:focus { outline: none; border-color: var(--primary); }
.auth-card button { width: 100%; padding: 12px; background: var(--primary); color: #fff; border-radius: 8px; font-size: 15px; font-weight: 500; margin-top: 6px; }
.auth-card button:hover { background: var(--primary-dark); }
.auth-card .alt { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-light); }
.auth-card .alt a { color: var(--primary); text-decoration: none; }

/* ---------- 状态徽章 ---------- */
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
.tag.in { background: #E0F5EE; color: #4EA88A; }
.tag.out { background: #FFE9EF; color: #E08BA0; }
.tag.damage { background: #FFF3E0; color: #E89B5A; }
.tag.init { background: #E0F4FB; color: #4FA8C9; }
.tag.buy { background: #EFEAF8; color: #A88FD8; }
.tag.pending { background: #FFF3E0; color: #E89B5A; }
.tag.approved { background: #E0F5EE; color: #4EA88A; }
.tag.rejected { background: #FFE9EF; color: #E08BA0; }
.tag.done { background: #E3F2FD; color: #1565C0; }

/* ---------- 诊断面板 ---------- */
.diag-box { background: #1e1e1e; color: #e0e0e0; padding: 12px; border-radius: 6px; font-family: "SF Mono", "Cascadia Code", Consolas, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; line-height: 1.6; max-height: 400px; overflow-y: auto; }
.empty { text-align: center; color: var(--text-light); padding: 30px 16px; font-size: 14px; }

/* ---------- 工具类 ---------- */
.flex { display: flex; gap: 8px; align-items: center; }
.flex.between { justify-content: space-between; }
.flex.wrap { flex-wrap: wrap; }
.mt { margin-top: 12px; }
.mb { margin-bottom: 12px; }
.text-light { color: var(--text-light); font-size: 13px; }
.danger-text { color: var(--danger); }

/* ---------- 批量录入行 ---------- */
.batch-list { display: flex; flex-direction: column; gap: 8px; }
.batch-row { background: #FAFBFC; border: 1px solid var(--border); border-radius: 8px;
  padding: 10px; display: flex; flex-direction: column; gap: 6px; position: relative; }
.batch-row .idx { position: absolute; top: -8px; left: 10px; background: var(--primary-light);
  color: var(--primary-dark); padding: 0 6px; border-radius: 8px; font-size: 11px; font-weight: 600; }
.batch-row .field-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.batch-row .field-row label { font-size: 12px; color: var(--text-light); min-width: 50px; }
.batch-row .field-row input,
.batch-row .field-row select,
.batch-row .field-row textarea { flex: 1; min-width: 0; padding: 7px 9px; border: 1px solid var(--border);
  border-radius: 6px; background: #fff; }
.batch-row .field-row input:focus,
.batch-row .field-row select:focus,
.batch-row .field-row textarea:focus { outline: none; border-color: var(--primary); }
.batch-row .del { align-self: flex-end; padding: 3px 10px; font-size: 12px; color: var(--danger);
  background: transparent; border: 1px solid var(--danger); border-radius: 4px; }
.batch-row .del:hover { background: var(--danger); color: #fff; }
.batch-add { width: 100%; padding: 9px; margin-top: 4px; background: var(--primary-light);
  color: var(--primary-dark); border: 1px dashed var(--primary); border-radius: 8px;
  font-size: 13px; cursor: pointer; }
.batch-add:hover { background: var(--primary); color: #fff; }
.optional-tag { display: inline-block; background: #f0f0f0; color: var(--text-light);
  font-size: 11px; padding: 0 5px; border-radius: 3px; margin-left: 4px; font-weight: 400; }
/* 报损标记 & 拍照上传 */
.damage-tag { display: inline-block; background: var(--pink); color: #c0506e;
  font-size: 11px; padding: 1px 7px; border-radius: 10px; margin-left: 6px; font-weight: 400; }
.check-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  font-size: 13px; cursor: pointer; user-select: none; }
.check-row input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--primary); cursor: pointer; margin: 0; }
.check-row .hint { font-size: 12px; color: var(--text-light); }
.photo-box { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.photo-btn { display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px; border: 2px dashed var(--primary); border-radius: 10px;
  background: var(--primary-light); color: var(--primary-dark); font-size: 13px;
  cursor: pointer; width: 100%; }
.photo-btn.has { border-style: solid; border-color: var(--success, #7cc79a); background: #eafaf0; color: #2c7a4b; }
.photo-preview { max-width: 140px; max-height: 140px; border-radius: 10px;
  border: 1px solid var(--border); cursor: zoom-in; object-fit: cover; }
.photo-thumb { width: 46px; height: 46px; border-radius: 8px; border: 1px solid var(--border);
  object-fit: cover; cursor: zoom-in; vertical-align: middle; }
.img-viewer { position: fixed; inset: 0; background: rgba(0,0,0,.82); z-index: 9999;
  display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
.img-viewer img { max-width: 94vw; max-height: 92vh; border-radius: 10px; }
</style>
</head>
<body>

<!-- Toast 容器 -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- 模态框容器 -->
<div id="modalWrap"></div>

<!-- 主体内容容器 -->
<div id="root"></div>

<script>
'use strict';

/* ============================================================
 * API 客户端
 * ============================================================ */
const API = '/api';
let TOKEN = localStorage.getItem('klf_token') || '';

function setToken(t) {
  TOKEN = t || '';
  if (t) localStorage.setItem('klf_token', t);
  else localStorage.removeItem('klf_token');
}
async function api(path, method = 'GET', body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (TOKEN) opts.headers['Authorization'] = 'Bearer ' + TOKEN;
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.error || '请求失败'), { code: r.status, data });
  return data;
}

/* ============================================================
 * 📷 照片：压缩 / 上传 / 预览
 * ============================================================ */
// 照片 URL（带 token 鉴权）
function photoUrl(p) {
  return API + '/photo?p=' + encodeURIComponent(p) + '&token=' + encodeURIComponent(TOKEN);
}
// 看大图
function viewPhoto(p) {
  const v = document.createElement('div');
  v.className = 'img-viewer';
  v.innerHTML = `<img src="${photoUrl(p)}" alt="照片">`;
  v.onclick = () => v.remove();
  document.body.appendChild(v);
}
// 本地预览看大图（还未上传的 dataURL）
function viewDataUrl(u) {
  const v = document.createElement('div');
  v.className = 'img-viewer';
  v.innerHTML = `<img src="${u}" alt="照片">`;
  v.onclick = () => v.remove();
  document.body.appendChild(v);
}
// 压缩图片：最长边 1280，JPEG 0.72，返回 dataURL
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('读取照片失败'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('照片无法识别'));
      img.onload = () => {
        const MAX = 1280;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', 0.72));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
// 上传压缩后的照片，返回存储路径
async function uploadPhoto(dataUrl) {
  const r = await api('/upload', 'POST', { data: dataUrl });
  return r.path;
}
/* ============================================================
 * 全局状态
 * ============================================================ */
const STATE = {
  me: null,
  items: [],
  logs: [],
  requests: [],
  users: [],
  pendingCount: 0,
  serverTime: '',
  tab: 'dashboard',
};

/* ============================================================
 * UI 工具
 * ============================================================ */
function toast(msg, type = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.getElementById('toastWrap').appendChild(t);
  setTimeout(() => t.remove(), 2800);
}
function modal(html, onClose = null) {
  const wrap = document.getElementById('modalWrap');
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  wrap.appendChild(bg);
  function close() {
    bg.remove();
    if (onClose) onClose();
  }
  return { bg, close };
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function fmtTime(t) {
  if (!t) return '';
  return t.replace('T', ' ').slice(0, 16);
}

/* ============================================================
 * 应用入口
 * ============================================================ */
async function bootstrap() {
  // 检查是否有保存的 token
  if (TOKEN) {
    try {
      const r = await api('/state');
      STATE.me = r.state.me;
      Object.assign(STATE, r.state);
      renderApp();
      return;
    } catch (e) {
      if (e.code === 401) setToken(''); // token 失效
      else { toast('连接服务器失败：' + e.message, 'error'); renderAuth(e.data && e.data.needSetup); return; }
    }
  }
  // 无 token，看是否需要初始化
  try {
    const r = await fetch(API + '/state').then(r => r.json()).catch(() => ({}));
    renderAuth(r.needSetup);
  } catch (e) {
    renderAuth(false); // 网络问题让用户试试
  }
}

/* ============================================================
 * 登录 / 注册 / 初始化页面
 * ============================================================ */
function renderAuth(needSetup) {
  const root = document.getElementById('root');
  if (needSetup) {
    root.innerHTML = `
      <div class="auth-wrap">
        <div class="auth-card">
          <h1>📦 可乐菲出入库</h1>
          <div class="sub">系统尚未初始化 · 请创建管理员账号</div>
          <div class="field"><label>管理员姓名</label><input id="authName" placeholder="如：小雪老师" autocomplete="username"></div>
          <div class="field"><label>密码（至少 4 位）</label><input id="authPass" type="password" autocomplete="new-password"></div>
          <button onclick="doSetup()">创建并进入系统</button>
        </div>
      </div>`;
    setTimeout(() => document.getElementById('authName')?.focus(), 100);
  } else {
    root.innerHTML = `
      <div class="auth-wrap">
        <div class="auth-card">
          <h1>📦 可乐菲出入库</h1>
          <div class="sub">多用户云端版 · 数据长期保存</div>
          <div class="field"><label>姓名</label><input id="authName" placeholder="如：小雪老师" autocomplete="username"></div>
          <div class="field"><label>密码</label><input id="authPass" type="password" autocomplete="current-password"></div>
          <button onclick="doLogin()">登录</button>
          <div class="alt">还没账号？<a href="#" onclick="showRegister();return false;">点这里自助注册</a></div>
        </div>
      </div>`;
    setTimeout(() => document.getElementById('authName')?.focus(), 100);
  }
}
async function doSetup() {
  const name = document.getElementById('authName').value.trim();
  const pass = document.getElementById('authPass').value;
  if (!name || pass.length < 4) return toast('姓名必填，密码至少 4 位', 'warning');
  try {
    const r = await api('/setup', 'POST', { name, pass });
    setToken(r.token);
    afterLogin(r.state);
    toast('系统初始化成功，欢迎 ' + name + '！', 'success');
  } catch (e) { toast(e.message, 'error'); }
}
async function doLogin() {
  const name = document.getElementById('authName').value.trim();
  const pass = document.getElementById('authPass').value;
  if (!name || !pass) return toast('请填写姓名和密码', 'warning');
  try {
    const r = await api('/login', 'POST', { name, pass });
    setToken(r.token);
    afterLogin(r.state);
    toast('登录成功', 'success');
  } catch (e) { toast(e.message, 'error'); }
}
function showRegister() {
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>📦 自助注册</h1>
        <div class="sub">注册后默认是普通用户，管理员可在用户管理页提权</div>
        <div class="field"><label>姓名</label><input id="authName" placeholder="如：王老师" autocomplete="username"></div>
        <div class="field"><label>密码（至少 4 位）</label><input id="authPass" type="password" autocomplete="new-password"></div>
        <button onclick="doRegister()">注册并登录</button>
        <div class="alt">已有账号？<a href="#" onclick="bootstrap();return false;">返回登录</a></div>
      </div>
    </div>`;
  setTimeout(() => document.getElementById('authName')?.focus(), 100);
}
async function doRegister() {
  const name = document.getElementById('authName').value.trim();
  const pass = document.getElementById('authPass').value;
  if (!name || pass.length < 4) return toast('姓名必填，密码至少 4 位', 'warning');
  try {
    const r = await api('/register', 'POST', { name, pass });
    setToken(r.token);
    afterLogin(r.state);
    toast('注册成功！', 'success');
  } catch (e) { toast(e.message, 'error'); }
}

/* ============================================================
 * 登录后主界面
 * ============================================================ */
function afterLogin(state) {
  STATE.me = state.me;
  STATE.items = state.items;
  STATE.logs = state.logs;
  STATE.requests = state.requests;
  STATE.users = state.users || [];
  STATE.pendingCount = state.pendingCount || 0;
  STATE.serverTime = state.serverTime;
  renderApp();
}

function renderApp() {
  const role = STATE.me.role;
  const isAdmin = role === 'admin';
  const canIn = role === 'admin' || role === 'authorized';

  // 默认进工作台
  if (!STATE.tab || STATE.tab === 'dashboard') STATE.tab = 'home';

  document.getElementById('root').innerHTML = `
    <div class="app">
      <div class="header">
        <div>
          <h1>📦 可乐菲出入库明细</h1>
          <div class="me">当前用户：<b>${escapeHtml(STATE.me.name)}</b>
            <span class="tag ${role === 'admin' ? 'in' : role === 'authorized' ? 'approved' : 'pending'}">${roleText(role)}</span>
          </div>
        </div>
        <button class="logout" onclick="doLogout()">退出登录</button>
      </div>

      <div id="tabBody"></div>
    </div>
  `;

  renderTab(STATE.tab);
}
function roleText(r) {
  return { admin: '管理员', authorized: '授权人员', normal: '普通用户' }[r] || r;
}
function switchTab(id) {
  STATE.tab = id;
  renderTab(id);
  // 切到子页时滚动到顶
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderTab(id) {
  const body = document.getElementById('tabBody');
  if (!body) return;
  // 子页加返回按钮
  const backBtn = (id !== 'home') ? `<button class="back-home" onclick="switchTab('home')">🏠 返回工作台</button>` : '';
  let html = '';
  if (id === 'home') html = renderHome();
  else if (id === 'items') html = renderItems();
  else if (id === 'inbound') html = renderInbound();
  else if (id === 'apply') html = renderApply();
  else if (id === 'approve') html = renderApprove();
  else if (id === 'logs') html = renderLogs();
  else if (id === 'settings') html = renderSettings();
  body.innerHTML = backBtn + html;
}

/* ============================================================
 * 🏠 工作台（首页宫格）
 * ============================================================ */
function renderHome() {
  const items = STATE.items;
  const total = items.length;
  const lowStock = items.filter(i => Number(i.qty) <= Number(i.minQty) && Number(i.minQty) > 0);
  const outStock = items.filter(i => Number(i.qty) === 0);
  const recent = STATE.logs.slice(0, 5);
  const pendingMine = STATE.requests.filter(r => r.applicant === STATE.me.name && r.status === 'pending');
  const role = STATE.me.role;
  const isAdmin = role === 'admin';
  const canIn = role === 'admin' || role === 'authorized';
  const hour = new Date().getHours();
  const greet = hour < 6 ? '夜深了' : hour < 12 ? '早上好' : hour < 14 ? '中午好' : hour < 18 ? '下午好' : '晚上好';

  // 宫格入口
  const cards = [
    { id: 'items', icon: '📦', name: '物品清单', desc: `共 ${total} 种`, color: 'c-blue', show: true },
    { id: 'inbound', icon: '📥', name: '入库', desc: '新货进仓', color: 'c-mint', show: canIn },
    { id: 'apply', icon: '📤', name: '提交申请', desc: '出库 / 报损 / 采买', color: 'c-pink', show: true },
    { id: 'approve', icon: '✅', name: '审批', desc: STATE.pendingCount ? `${STATE.pendingCount} 条待审` : '无待审', color: 'c-lavender', show: isAdmin, badge: STATE.pendingCount },
    { id: 'logs', icon: '📋', name: '台账', desc: '出入库流水', color: 'c-cream', show: true },
    { id: 'settings', icon: '⚙️', name: '设置', desc: '账号与数据', color: 'c-peach', show: true },

  return `

      <span class="wave">👋</span>
      <div>
        <b>${greet}，${escapeHtml(STATE.me.name)}</b>

      </div>
    </div>

    <div class="wb-stats">
      <div class="wb-stat">
        <div class="num">${total}</div>
        <div class="lbl">物品种类</div>
      </div>
      <div class="wb-stat s-mint">
        <div class="num">${STATE.logs.length}</div>
        <div class="lbl">流水记录</div>
      </div>
      <div class="wb-stat s-pink">
        <div class="num">${lowStock.length + outStock.length}</div>
        <div class="lbl">库存预警</div>
      </div>
    </div>

    <div class="workbench">
      ${cards.map(c => `
        <div class="wb-card ${c.color}" onclick="switchTab('${c.id}')">
          ${c.badge ? `<span class="badge-dot">${c.badge}</span>` : ''}
          <div class="icon">${c.icon}</div>
          <div class="name">${c.name}</div>
          <div class="desc">${c.desc}</div>
        </div>
      `).join('')}
    </div>

    ${lowStock.length || outStock.length ? `
    <div class="card">
      <h2>⚠️ 库存预警（${lowStock.length + outStock.length}）</h2>
      <div class="list">
        ${[...outStock.map(it => ({...it, _out: true})), ...lowStock].map(it => `
          <div class="item-card ${it._out ? 'out' : 'warn'}">
            <div class="name">${escapeHtml(it.name)}</div>
            <div class="meta">${escapeHtml(it.spec || '')} ${escapeHtml(it.unit)}${it._out ? ' · 已用完' : ` · 预警线 ${it.minQty}`}</div>
            <div class="qty">${it.qty}<small>${escapeHtml(it.unit)}</small></div>
            ${canIn ? `<div class="btn-row"><button class="btn small" onclick="quickInbound('${it.id}')">📥 快速入库</button></div>` : ''}
          </div>
        `).join('')}
      </div>

    ${recent.length ? `
    <div class="card">
      <h2>📋 最近流水</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>时间</th><th>类型</th><th>物品</th><th>数量</th><th>操作人</th></tr></thead>
        <tbody>${recent.map(l => `
          <tr>
            <td>${fmtTime(l.time)}</td>
            <td><span class="tag ${l.type}">${typeText(l.type)}</span></td>
            <td>${escapeHtml(l.itemName)}</td>
            <td>${l.type === 'in' || l.type === 'init' ? '+' : '-'}${l.qty} ${escapeHtml(l.unit)}</td>
            <td>${escapeHtml(l.person)}</td>
          </tr>`).join('')}</tbody>
      </table></div>
      <div style="text-align:center;margin-top:10px;">
        <button class="btn small ghost" onclick="switchTab('logs')">查看全部 →</button>
      </div>
    </div>` : ''}

    ${pendingMine.length ? `
    <div class="card">
      <h2>⏳ 我的待审批申请（${pendingMine.length}）</h2>

function typeText(t) {
  return { in: '入库', out: '出库', damage: '报损', init: '建档', buy: '采买' }[t] || t;
}

/* ============================================================
 * 📦 物品
 * ============================================================ */
function renderItems() {
  const canIn = STATE.me.role === 'admin' || STATE.me.role === 'authorized';
  return `
    <div class="card">
      <div class="flex between">
        <h2>📦 物品清单（${STATE.items.length}）</h2>
        ${canIn ? `<button class="btn" onclick="showAddItem()">➕ 新增物品</button>` : ''}
      </div>
      <div class="row">
        <input id="itemSearch" placeholder="搜索物品名称..." oninput="filterItems()" style="max-width: 280px;">
      </div>
      <div id="itemsList">
        ${renderItemsList(STATE.items)}
      </div>
    </div>
  `;
}
function renderItemsList(items) {
  if (!items.length) return '<div class="empty">暂无物品</div>';
  return `<div class="list">
    ${items.map(it => {
      const low = Number(it.qty) <= Number(it.minQty);
      const out = Number(it.qty) === 0;
      return `<div class="item-card ${out ? 'out' : low ? 'warn' : ''}">
        <div class="name">${escapeHtml(it.name)}${it.needDamage ? '<span class="damage-tag">需报损</span>' : ''} <small class="text-light">${escapeHtml(it.code)}</small></div>
        <div class="meta">${escapeHtml(it.spec || '')} · 预警线 ${it.minQty} ${escapeHtml(it.unit)}</div>
        <div class="qty">${it.qty}<small>${escapeHtml(it.unit)}</small></div>
        ${canEdit() ? `<div class="btn-row">
          <button class="btn small" onclick="showEditItem('${it.id}')">✏️ 编辑</button>
          ${STATE.me.role === 'admin' ? `<button class="btn small danger" onclick="delItem('${it.id}')">删除</button>` : ''}
        </div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}
function canEdit() { return STATE.me.role === 'admin' || STATE.me.role === 'authorized'; }
function filterItems() {
  const q = document.getElementById('itemSearch').value.trim().toLowerCase();
  const filtered = q ? STATE.items.filter(i =>
    i.name.toLowerCase().includes(q) || (i.spec || '').toLowerCase().includes(q)
  ) : STATE.items;
  document.getElementById('itemsList').innerHTML = renderItemsList(filtered);
}

function showAddItem() {
  const m = modal(`
    <h3>➕ 新增物品</h3>
    <div class="row"><label>物品名称</label><input id="f_name" placeholder="如：双面胶"></div>
    <div class="row"><label>规格</label><input id="f_spec" placeholder="如：宽 4cm"></div>
    <div class="row"><label>分类</label><input id="f_cat" placeholder="如：胶棒/水彩/彩纸"></div>
    <div class="row"><label>单位</label><input id="f_unit" value="件"></div>
    <div class="row"><label>期初数量</label><input id="f_init" type="number" min="0" value="0"></div>
    <div class="row"><label>预警线</label><input id="f_min" type="number" min="0" value="0"></div>
    <label class="check-row"><input type="checkbox" id="f_need_damage">
      <span>📸 需要报损 <span class="hint">出库/报损时必须拍摄旧物品照片</span></span>
    </label>
    <div class="btn-row">
      <button class="btn ghost" onclick="this.closest('.modal-bg').remove()">取消</button>
      <button class="btn" onclick="addItem()">保存</button>
    </div>
  `);
  setTimeout(() => document.getElementById('f_name')?.focus(), 100);
}
async function addItem() {
  const data = {
    action: 'add',
    name: document.getElementById('f_name').value.trim(),
    spec: document.getElementById('f_spec').value.trim(),
    category: document.getElementById('f_cat').value.trim(),
    unit: document.getElementById('f_unit').value.trim() || '件',
    initQty: Number(document.getElementById('f_init').value) || 0,
    minQty: Number(document.getElementById('f_min').value) || 0,
    needDamage: document.getElementById('f_need_damage').checked,
  };
  if (!data.name) return toast('请填写物品名称', 'warning');
  try {
    await api('/items', 'POST', data);
    document.querySelector('.modal-bg').remove();
    toast('物品已添加', 'success');
    await refreshState();
    renderTab(STATE.tab);
  } catch (e) { toast(e.message, 'error'); }
}
function showEditItem(id) {
  const it = STATE.items.find(x => x.id === id);
  if (!it) return;
  modal(`
    <h3>✏️ 编辑物品</h3>
    <div class="row"><label>名称</label><input id="f_name" value="${escapeHtml(it.name)}"></div>
    <div class="row"><label>规格</label><input id="f_spec" value="${escapeHtml(it.spec || '')}"></div>
    <div class="row"><label>分类</label><input id="f_cat" value="${escapeHtml(it.category || '')}"></div>
    <div class="row"><label>单位</label><input id="f_unit" value="${escapeHtml(it.unit)}"></div>
    <div class="row"><label>预警线</label><input id="f_min" type="number" min="0" value="${it.minQty}"></div>
    <label class="check-row"><input type="checkbox" id="f_need_damage" ${it.needDamage ? 'checked' : ''}>
      <span>📸 需要报损 <span class="hint">出库/报损时必须拍摄旧物品照片</span></span>
    </label>
    <div class="text-light">当前库存：${it.qty} ${escapeHtml(it.unit)}（要改库存请走"入库"流程）</div>
    <div class="btn-row">
      <button class="btn ghost" onclick="this.closest('.modal-bg').remove()">取消</button>
      <button class="btn" onclick="editItem('${id}')">保存</button>
    </div>
  `);
}
async function editItem(id) {
  const data = {
    action: 'update', id,
    name: document.getElementById('f_name').value.trim(),
    spec: document.getElementById('f_spec').value.trim(),
    category: document.getElementById('f_cat').value.trim(),
    unit: document.getElementById('f_unit').value.trim(),
    minQty: Number(document.getElementById('f_min').value) || 0,
    needDamage: document.getElementById('f_need_damage').checked,
  };
  try {
    await api('/items', 'POST', data);
    document.querySelector('.modal-bg').remove();
    toast('已保存', 'success');
    await refreshState();
    renderTab(STATE.tab);
  } catch (e) { toast(e.message, 'error'); }
}
async function delItem(id) {
  if (!confirm('确定删除该物品？相关日志会保留。')) return;
  try {
    await api('/items', 'POST', { action: 'delete', id });
    toast('已删除', 'success');
    await refreshState();
    renderTab(STATE.tab);
  } catch (e) { toast(e.message, 'error'); }
}

/* ============================================================
 * 📥 入库（支持批量录入）
 * ============================================================ */
// 行模板：根据物品列表生成下拉选项 HTML
function inboundItemOpts() {
  return STATE.items.map(it =>
    `<option value="${it.id}">${escapeHtml(it.name)} (${escapeHtml(it.spec || '')}) · 现 ${it.qty} ${escapeHtml(it.unit)}</option>`
  ).join('') + `<option value="__new__">➕ 新物品（基本信息里没有，入库后自动建档）</option>`;
}
function inboundRowHtml(idx, isFirst) {
  return `
    <div class="batch-row" data-idx="${idx}">
      <span class="idx">#${idx + 1}</span>
      <div class="field-row">
        <label>物品</label>
        <select class="in_item" onchange="toggleInboundNew(this)">${inboundItemOpts()}</select>
      </div>
      <div class="field-row in_new_fields" style="display:none">
        <label>新物品名</label>
        <input class="in_new_name" placeholder="基本信息里没有的物品名">
      </div>
      <div class="field-row in_new_fields" style="display:none">
        <label>规格<span class="optional-tag">选填</span></label>
        <input class="in_new_spec" placeholder="如：330ml×24">
      </div>
      <div class="field-row in_new_fields" style="display:none">
        <label>单位</label>
        <input class="in_new_unit" value="件">
      </div>
      <div class="field-row in_new_fields" style="display:none">
        <label class="check-row"><input type="checkbox" class="in_new_damage">
          <span>📸 需要报损 <span class="hint">出库时需拍旧物品照片</span></span>
        </label>
      </div>
      <div class="field-row">
        <label>数量</label>
        <input class="in_qty" type="number" min="0.01" step="0.01" placeholder="如：10">
      </div>
      <div class="field-row">
        <label>备注<span class="optional-tag">选填</span></label>
        <input class="in_remark" placeholder="如：淘宝购入">
      </div>
      ${isFirst ? '' : `<button type="button" class="del" onclick="removeInboundRow(this)">✕ 删除此行</button>`}
    </div>
  `;
}
// 选择「➕ 新物品」时展开新物品字段
function toggleInboundNew(sel) {
  const row = sel.closest('.batch-row');
  if (!row) return;
  const isNew = sel.value === '__new__';
  row.querySelectorAll('.in_new_fields').forEach(fr => { fr.style.display = isNew ? 'flex' : 'none'; });
  if (isNew) { const nm = row.querySelector('.in_new_name'); if (nm) nm.focus(); }
}
function renderInbound() {
  return `
    <div class="card">
      <h2>📥 直接入库（无需审批）</h2>
      <div class="text-light mb">入库会立即增加数量并记录流水。可一次录入多种物品；物品下拉里选「➕ 新物品」可直接入基本信息里还没有的东西，入库完自动建档。仅管理员和授权人员可操作。</div>
      <div id="inboundList" class="batch-list">${inboundRowHtml(0, true)}</div>
      <button type="button" class="batch-add" onclick="addInboundRow()">＋ 添加一种物品</button>
      <div class="btn-row">
        <button class="btn success" onclick="doInbound()">✓ 确认入库（共 <span id="inboundCount">1</span> 种）</button>
        <button type="button" class="btn ghost small" onclick="resetInboundRows()">清空</button>
      </div>
    </div>
  `;
}
function addInboundRow() {
  const list = document.getElementById('inboundList');
  const idx = list.children.length;
  list.insertAdjacentHTML('beforeend', inboundRowHtml(idx, false));
  updateInboundCount();
  // 焦点跳到新行的物品下拉
  const rows = list.querySelectorAll('.batch-row');
  if (rows[idx]) rows[idx].querySelector('.in_item').focus();
}
function removeInboundRow(btn) {
  const row = btn.closest('.batch-row');
  row.remove();
  // 重新索引
  document.querySelectorAll('#inboundList .batch-row').forEach((r, i) => {
    r.setAttribute('data-idx', i);
    r.querySelector('.idx').textContent = '#' + (i + 1);
    // 第一行不显示删除按钮
    const delBtn = r.querySelector('.del');
    if (i === 0 && delBtn) delBtn.remove();
  });
  updateInboundCount();
}
function resetInboundRows() {
  document.getElementById('inboundList').innerHTML = inboundRowHtml(0, true);
  updateInboundCount();
}
function updateInboundCount() {
  const c = document.querySelectorAll('#inboundList .batch-row').length;
  const el = document.getElementById('inboundCount');
  if (el) el.textContent = c;
}
async function doInbound() {
  const rows = Array.from(document.querySelectorAll('#inboundList .batch-row'));
  const items = [];
  for (const row of rows) {
    const selVal = row.querySelector('.in_item').value;
    const qty = Number(row.querySelector('.in_qty').value);
    const remark = row.querySelector('.in_remark').value.trim();
    if (!qty || qty <= 0) {
      row.querySelector('.in_qty').focus();
      return toast('请填写每一行的数量', 'warning');
    }
    if (selVal === '__new__') {
      const newName = row.querySelector('.in_new_name').value.trim();
      if (!newName) {
        row.querySelector('.in_new_name').focus();
        return toast('请填写新物品的名称', 'warning');
      }
      items.push({
        newName,
        spec: row.querySelector('.in_new_spec').value.trim(),
        unit: row.querySelector('.in_new_unit').value.trim() || '件',
        needDamage: row.querySelector('.in_new_damage').checked,
        qty, remark,
      });
    } else {
      items.push({ itemId: selVal, qty, remark });
    }
  }
  if (items.length === 0) return toast('请至少添加一种入库物品', 'warning');
  try {
    const r = await api('/inbound', 'POST', { items });
    if (items.length === 1) {
      const x = r.results[0];
      toast(`入库成功！${x.name} 从 ${x.before} → ${x.after} ${x.unit}${x.created ? '（已自动建档）' : ''}`, 'success');
    } else {
      const created = r.results.filter(x => x.created).length;
      toast(`批量入库成功！共 ${r.count} 种物品${created ? `，其中 ${created} 种已自动建档` : ''}`, 'success');
    }
    resetInboundRows();
    await refreshState();
    renderTab(STATE.tab);
  } catch (e) { toast(e.message, 'error'); }
}

function switchApplyType() {
  const t = document.getElementById('ap_type').value;
  const setDisp = (row, sel, val) => {
    const el = row.querySelector(sel);
    if (el) { const fr = el.closest('.field-row'); if (fr) fr.style.display = val; }
  };
  document.querySelectorAll('#applyList .batch-row').forEach((r) => {
    const isBuy = (t === 'buy');
    r.querySelectorAll('.field-row').forEach(fr => fr.style.display = '');
    setDisp(r, '.ap_item', isBuy ? 'none' : '');
    setDisp(r, '.ap_buy_name', isBuy ? '' : 'none');
    setDisp(r, '.ap_buy_spec', isBuy ? '' : 'none');
    setDisp(r, '.ap_buy_unit', isBuy ? '' : 'none');
  });
}
function addApplyRow() {
  const list = document.getElementById('applyList');
  const idx = list.children.length;
  const t = document.getElementById('ap_type').value;
  list.insertAdjacentHTML('beforeend', applyRowHtml(idx, t, false));
  updateApplyCount();
  const rows = list.querySelectorAll('.batch-row');
  if (rows[idx]) {
    const firstInput = rows[idx].querySelector(t === 'buy' ? '.ap_buy_name' : '.ap_item');
    if (firstInput) firstInput.focus();
  }
}
function removeApplyRow(btn) {
  const row = btn.closest('.batch-row');
  row.remove();
  document.querySelectorAll('#applyList .batch-row').forEach((r, i) => {
    r.setAttribute('data-idx', i);
    r.querySelector('.idx').textContent = '#' + (i + 1);
    const delBtn = r.querySelector('.del');
    if (i === 0 && delBtn) delBtn.remove();
  });
  updateApplyCount();
}
function resetApplyRows() {
  const t = document.getElementById('ap_type').value;
  document.getElementById('applyList').innerHTML = applyRowHtml(0, t, true);
  updateApplyCount();
}
function updateApplyCount() {
  const c = document.querySelectorAll('#applyList .batch-row').length;
  const el = document.getElementById('applyCount');
  if (el) el.textContent = c;
}
function statusText(s) {
  return { pending: '待审批', approved: '已批准', rejected: '已驳回', done: '已完成' }[s] || s;
}
async function submitApply() {
  const type = document.getElementById('ap_type').value;
  const rows = Array.from(document.querySelectorAll('#applyList .batch-row'));
  if (rows.length === 0) return toast('请至少添加一种申请', 'warning');

  // 收集所有行
  const requests = [];
  const buyItems = [];
  for (const row of rows) {
    const qty = Number(row.querySelector('.ap_qty').value);
    if (!qty || qty <= 0) {
      row.querySelector('.ap_qty').focus();
      return toast('请填写每一行的数量', 'warning');
    }
    const reason = row.querySelector('.ap_reason').value.trim();
    if (type === 'buy') {
      const name = row.querySelector('.ap_buy_name').value.trim();
      if (!name) {
        row.querySelector('.ap_buy_name').focus();
        return toast('请填写需要采买的物品名', 'warning');
      }
      buyItems.push({
        itemName: name,
        spec: row.querySelector('.ap_buy_spec').value.trim(),
        unit: row.querySelector('.ap_buy_unit').value.trim() || '件',
        qty, reason,
      });
    } else {
      const itemId = row.querySelector('.ap_item').value;
      if (!itemId) {
        row.querySelector('.ap_item').focus();
        return toast('请选择物品', 'warning');
      }
      requests.push({ type, itemId, qty, reason, photo: '' });
    }
  }

  try {
    let totalCount = 0;
    if (type === 'buy') {
      const r = await api('/buy', 'POST', { items: buyItems });
      totalCount = r.count;
    } else {
      const r = await api('/req', 'POST', { requests });
      totalCount = r.count;
    }
    toast(`已提交 ${totalCount} 种申请，等管理员审批`, 'success');
    resetApplyRows();
    await refreshState();
    renderTab(STATE.tab);
  } catch (e) { toast(e.message, 'error'); }

    await refreshState();
    renderTab(STATE.tab);
  } catch (e) { toast(e.message, 'error'); }
}

function filterLogs() {
  const t = document.getElementById('lg_type').value;
  const i = document.getElementById('lg_item').value.trim().toLowerCase();
  const p = document.getElementById('lg_person').value.trim().toLowerCase();
  const filtered = STATE.logs.filter(l =>
    (!t || l.type === t) &&
    (!i || l.itemName.toLowerCase().includes(i)) &&
    (!p || l.person.toLowerCase().includes(p))
  );
  const el = document.getElementById('logsList');
  if (!filtered.length) { el.innerHTML = '<div class="empty">无匹配流水</div>'; return; }
  el.innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>时间</th><th>类型</th><th>物品</th><th>规格</th><th>数量</th><th>变动</th><th>操作人</th><th>备注</th></tr></thead>
    <tbody>${filtered.map(l => `
      <tr>
        <td>${fmtTime(l.time)}</td>
        <td><span class="tag ${l.type}">${typeText(l.type)}</span></td>
        <td>${escapeHtml(l.itemName)}</td>
        <td class="text-light">${escapeHtml(l.spec || '')}</td>
        <td>${l.qty} ${escapeHtml(l.unit)}</td>
        <td>${l.before} → ${l.after}</td>
        <td>${escapeHtml(l.person)}</td>
        <td class="text-light">${escapeHtml(l.remark || '')}</td>
      </tr>
    `).join('')}</tbody>
  </table></div>
  <div class="btn-row mt"><button class="btn ghost" onclick="exportCsv()">📥 导出 CSV</button></div>`;
}
function exportCsv() {
  const t = document.getElementById('lg_type').value;
  const i = document.getElementById('lg_item').value.trim().toLowerCase();
  const p = document.getElementById('lg_person').value.trim().toLowerCase();
  const rows = [['时间', '类型', '物品', '规格', '单位', '变动前', '数量', '变动后', '操作人', '备注']];
  STATE.logs.filter(l =>
    (!t || l.type === t) &&
    (!i || l.itemName.toLowerCase().includes(i)) &&
    (!p || l.person.toLowerCase().includes(p))
  ).forEach(l => {
    rows.push([l.time, typeText(l.type), l.itemName, l.spec || '', l.unit || '',
      l.before, l.qty, l.after, l.person, l.remark || '']);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `台账-${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
  toast('已导出 CSV', 'success');
}

      <div class="table-wrap"><table>
        <thead><tr><th>姓名</th><th>角色</th><th>创建日期</th><th>操作</th></tr></thead>
        <tbody>${STATE.users.map(u => `
          <tr>
            <td>${escapeHtml(u.name)} ${u.id === STATE.me.id ? '<span class="text-light">(我)</span>' : ''}</td>
            <td><span class="tag ${u.role === 'admin' ? 'in' : u.role === 'authorized' ? 'approved' : 'pending'}">${roleText(u.role)}</span></td>
            <td class="text-light">${u.createdAt}</td>
            <td>
              ${u.id !== STATE.me.id ? `
                <button class="btn small" onclick="showUserAction('${u.id}')">⚙️ 管理</button>
              ` : ''}
            </td>
          </tr>
        `).join('')}</tbody>
      </table></div>
    </div>` : ''}

    ${isAdmin ? `
    <div class="card">
      <h2>💾 备份与恢复</h2>
      <div class="text-light mb">每周建议下载一份 JSON 备份到本地。即使服务器数据丢失，也能一键恢复。</div>
      <div class="btn-row">
        <button class="btn" onclick="downloadBackup()">📥 下载备份</button>
        <button class="btn ghost" onclick="document.getElementById('restoreFile').click()">📤 从备份恢复</button>
        <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restoreBackup(this)">
      </div>
    </div>` : ''}

    <div class="card">
      <h2>🔍 诊断信息</h2>
      <div id="diagBox" class="diag-box">点击下方按钮加载诊断信息...</div>
      <div class="btn-row">
        <button class="btn ghost" onclick="loadDiag()">🔄 刷新诊断</button>
        <button class="btn ghost" onclick="copyDiag()">📋 复制</button>
      </div>
    </div>
  `;
}
function showChangePass() {
  modal(`
    <h3>🔑 修改密码</h3>
    <div class="row"><label>原密码</label><input id="cp_old" type="password"></div>
    <div class="row"><label>新密码</label><input id="cp_new" type="password" placeholder="至少 4 位"></div>
    <div class="btn-row">
      <button class="btn ghost" onclick="this.closest('.modal-bg').remove()">取消</button>
      <button class="btn" onclick="changePass()">提交</button>
    </div>
  `);
}
async function changePass() {
  const oldPass = document.getElementById('cp_old').value;
  const newPass = document.getElementById('cp_new').value;
  if (!oldPass || newPass.length < 4) return toast('请填写完整', 'warning');
  try {
    await api('/changepass', 'POST', { oldPass, newPass });
    document.querySelector('.modal-bg').remove();
    toast('密码已修改，请重新登录', 'success');
    setTimeout(() => doLogout(), 1000);
  } catch (e) { toast(e.message, 'error'); }
}
function showAddUser() {
  modal(`
    <h3>➕ 添加用户</h3>
    <div class="row"><label>姓名</label><input id="au_name" placeholder="如：王老师"></div>
    <div class="row"><label>密码</label><input id="au_pass" type="password" placeholder="至少 4 位"></div>
    <div class="row"><label>角色</label>
      <select id="au_role">
        <option value="normal">普通用户（只能看自己）</option>
        <option value="authorized">授权人员（可入库）</option>
        <option value="admin">管理员（全部权限）</option>
      </select>
    </div>
    <div class="btn-row">
      <button class="btn ghost" onclick="this.closest('.modal-bg').remove()">取消</button>
      <button class="btn" onclick="addUser()">添加</button>
    </div>
  `);
}
async function addUser() {
  const data = {
    action: 'add',
    name: document.getElementById('au_name').value.trim(),
    pass: document.getElementById('au_pass').value,
    role: document.getElementById('au_role').value,
  };
  if (!data.name || data.pass.length < 4) return toast('请填写完整', 'warning');
  try {
    await api('/users', 'POST', data);
    document.querySelector('.modal-bg').remove();
    toast('已添加', 'success');
    await refreshState();
    renderTab(STATE.tab);
  } catch (e) { toast(e.message, 'error'); }
}
function showUserAction(userId) {
  const u = STATE.users.find(x => x.id === userId);
  if (!u) return;
  modal(`
    <h3>⚙️ 管理用户：${escapeHtml(u.name)}</h3>
    <div class="row"><label>角色</label>
      <select id="ua_role">
        <option value="normal" ${u.role === 'normal' ? 'selected' : ''}>普通用户</option>
        <option value="authorized" ${u.role === 'authorized' ? 'selected' : ''}>授权人员</option>
        <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>管理员</option>
      </select>
    </div>
    <div class="btn-row">
      <button class="btn ghost" onclick="this.closest('.modal-bg').remove()">取消</button>
      <button class="btn" onclick="changeRole('${userId}')">保存角色</button>
    </div>
    <h3 class="mt">重置密码</h3>
    <div class="row"><label>新密码</label><input id="ua_pass" placeholder="至少 4 位"></div>
    <div class="btn-row">
      <button class="btn warning" onclick="resetPass('${userId}')">重置密码</button>
    </div>
    <h3 class="mt">删除用户</h3>
    <div class="text-light mb">删除后该用户所有申请记录会保留，但无法登录。</div>
    <div class="btn-row">
      <button class="btn danger" onclick="deleteUser('${userId}')">🗑 删除</button>
    </div>
  `);
}
async function changeRole(userId) {
  const role = document.getElementById('ua_role').value;
  try {
    await api('/users', 'POST', { action: 'role', userId, role });
    document.querySelector('.modal-bg').remove();
    toast('角色已修改', 'success');
    await refreshState();
    renderTab(STATE.tab);
  } catch (e) { toast(e.message, 'error'); }
}
async function resetPass(userId) {
  const pass = document.getElementById('ua_pass').value;
  if (pass.length < 4) return toast('密码至少 4 位', 'warning');
  try {
    await api('/users', 'POST', { action: 'resetpass', userId, pass });
    document.querySelector('.modal-bg').remove();
    toast('密码已重置', 'success');
  } catch (e) { toast(e.message, 'error'); }
}
async function deleteUser(userId) {
  if (!confirm('确定删除该用户？')) return;
  try {
    await api('/users', 'POST', { action: 'delete', userId });
    document.querySelector('.modal-bg').remove();
    toast('已删除', 'success');
    await refreshState();
    renderTab(STATE.tab);
  } catch (e) { toast(e.message, 'error'); }
}
async function downloadBackup() {
  try {
    const r = await fetch(API + '/backup', { headers: { Authorization: 'Bearer ' + TOKEN } });
    if (!r.ok) throw new Error('下载失败');
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `keleifei-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(url);
    toast('备份已下载', 'success');
  } catch (e) { toast(e.message, 'error'); }
}
async function restoreBackup(input) {
  const file = input.files[0];
  if (!file) return;
  if (!confirm('恢复将覆盖所有现有数据，确定？')) { input.value = ''; return; }
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    await api('/restore', 'POST', { data });
    toast('恢复成功！', 'success');
    input.value = '';
    await refreshState();
    setTimeout(() => location.reload(), 1000);
  } catch (e) { toast(e.message, 'error'); input.value = ''; }
}
async function loadDiag() {
  const el = document.getElementById('diagBox');
  el.textContent = '加载中...';
  try {
    const r = await api('/diag');
    el.textContent = JSON.stringify(r, null, 2);
  } catch (e) {
    el.textContent = '加载失败：' + e.message;
  }
}
function copyDiag() {
  const text = document.getElementById('diagBox').textContent;
  navigator.clipboard?.writeText(text).then(() => toast('已复制', 'success')).catch(() => toast('复制失败', 'error'));
}

/* ============================================================
 * 退出登录
 * ============================================================ */
async function doLogout() {
  try { await api('/logout', 'POST'); } catch (e) {}
  setToken('');
  STATE.me = null;
  bootstrap();
}

/* ============================================================
 * 刷新数据
 * ============================================================ */
async function refreshState() {
  try {
    const r = await api('/state');
    afterLogin(r.state);
  } catch (e) {
    if (e.code === 401) { setToken(''); bootstrap(); }
    else toast('刷新失败：' + e.message, 'error');
  }
}

// 启动
bootstrap();
</script>
</body>
</html>
